<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <style>
      .pulse-ring-1 { animation: pulse1 3s infinite ease-out; transform-origin: 765px 125px; }
      .pulse-ring-2 { animation: pulse1 3s infinite 1.5s ease-out; transform-origin: 765px 125px; }
      .blink-dot { animation: blink 1.6s infinite ease-in-out; }
      .blink-fast { animation: blink 1.1s infinite ease-in-out; }
      .bar-1 { animation: barAnim1 2.8s infinite ease-in-out; }
      .bar-2 { animation: barAnim2 3.2s infinite ease-in-out; }
      .bar-3 { animation: barAnim3 2.5s infinite ease-in-out; }
      @keyframes pulse1 {
        0% { r: 12px; opacity: 0.9; }
        100% { r: 74px; opacity: 0; }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.25; }
      }
      @keyframes barAnim1 {
        0%, 100% { width: 72px; }
        50% { width: 44px; }
      }
      @keyframes barAnim2 {
        0%, 100% { width: 48px; }
        50% { width: 76px; }
      }
      @keyframes barAnim3 {
        0%, 100% { width: 64px; }
        50% { width: 34px; }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="916" height="236" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="2" />
  <rect x="10" y="2" width="900" height="4" rx="2" fill="url(#accentGrad)" />

  <line x1="2" y1="60" x2="918" y2="60" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,6" />
  <line x1="2" y1="120" x2="918" y2="120" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,6" />
  <line x1="2" y1="180" x2="918" y2="180" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,6" />
  <line x1="540" y1="6" x2="540" y2="234" stroke="#1e293b" stroke-width="1" stroke-dasharray="6,6" />

  <rect x="42" y="26" width="184" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
  <circle class="blink-dot" cx="58" cy="39" r="4.5" fill="#34d399" />
  <text x="72" y="43" fill="#6ee7b7" font-family="Consolas, Monaco, monospace" font-size="11" font-weight="bold">CI/CD + PYTEST PASSING</text>

  <text x="42" y="96" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="bold">Sentinel</text>
  <text x="200" y="96" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="bold">ML</text>

  <text x="42" y="126" fill="#e2e8f0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold">Explainable Network Intrusion Detection and MLOps Platform</text>
  <text x="42" y="152" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Cost-Sensitive Ensembles  |  PR-AUC Threshold Tuning  |  SHAP XAI  |  KS Drift Telemetry</text>

  <g transform="translate(42, 176)" font-family="Consolas, Monaco, monospace" font-size="11" font-weight="bold">
    <rect x="0" y="0" width="82" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <text x="41" y="17" fill="#38bdf8" text-anchor="middle">Python 3.11</text>

    <rect x="90" y="0" width="92" height="26" rx="6" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
    <text x="136" y="17" fill="#34d399" text-anchor="middle">RF / XGBoost</text>

    <rect x="190" y="0" width="64" height="26" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
    <text x="222" y="17" fill="#a5b4fc" text-anchor="middle">SHAP</text>

    <rect x="262" y="0" width="74" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <text x="299" y="17" fill="#7dd3fc" text-anchor="middle">FastAPI</text>

    <rect x="344" y="0" width="70" height="26" rx="6" fill="#0f172a" stroke="#f472b6" stroke-width="1.2" />
    <text x="379" y="17" fill="#f9a8d4" text-anchor="middle">MLflow</text>

    <rect x="422" y="0" width="80" height="26" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.2" />
    <text x="462" y="17" fill="#fde047" text-anchor="middle">Streamlit</text>
  </g>

  <g transform="translate(560, 62)">
    <rect x="0" y="0" width="112" height="118" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="12" y="22" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="9.5" font-weight="bold">SHAP XAI DRIVERS</text>
    <rect class="bar-1" x="12" y="34" width="72" height="8" rx="4" fill="#38bdf8" />
    <rect class="bar-2" x="12" y="52" width="48" height="8" rx="4" fill="#34d399" />
    <rect class="bar-3" x="12" y="70" width="64" height="8" rx="4" fill="#818cf8" />
    <rect class="bar-2" x="12" y="88" width="52" height="8" rx="4" fill="#f59e0b" />
  </g>

  <circle cx="765" cy="125" r="74" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <circle cx="765" cy="125" r="50" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />
  <circle cx="765" cy="125" r="26" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />

  <circle class="pulse-ring-1" cx="765" cy="125" r="14" fill="none" stroke="#38bdf8" stroke-width="2" />
  <circle class="pulse-ring-2" cx="765" cy="125" r="14" fill="none" stroke="#34d399" stroke-width="1.5" />

  <circle cx="765" cy="125" r="11" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5" />
  <circle class="blink-dot" cx="765" cy="125" r="4" fill="#34d399" />

  <circle class="blink-fast" cx="798" cy="96" r="4.5" fill="#f43f5e" />
  <circle class="blink-dot" cx="726" cy="146" r="4" fill="#34d399" />
  <circle class="blink-fast" cx="782" cy="168" r="3.5" fill="#38bdf8" />
