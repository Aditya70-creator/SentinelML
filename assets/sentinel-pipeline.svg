<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 155" width="920" height="155">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#172554" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="trackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <style>
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashMove 1.2s linear infinite;
      }
      .node-pulse {
        animation: nodeGlow 2.4s ease-in-out infinite;
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -28; }
      }
      @keyframes nodeGlow {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </defs>

  <rect x="2" y="2" width="916" height="151" rx="14" fill="url(#pipeBg)" stroke="#1e3a8a" stroke-width="1.5" />

  <line x1="90" y1="77" x2="830" y2="77" stroke="#1e293b" stroke-width="6" />
  <line class="flow-line" x1="90" y1="77" x2="830" y2="77" stroke="url(#trackGrad)" stroke-width="3" />

  <g transform="translate(22, 32)">
    <rect x="0" y="0" width="148" height="90" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.8" />
    <circle class="node-pulse" cx="132" cy="16" r="4" fill="#38bdf8" />
    <text x="74" y="28" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">1. TELEMETRY</text>
    <text x="74" y="52" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">Network Flows</text>
    <text x="74" y="72" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="10" text-anchor="middle">Impute + Scale</text>
  </g>

  <g transform="translate(204, 32)">
    <rect x="0" y="0" width="148" height="90" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.8" />
    <circle class="node-pulse" cx="132" cy="16" r="4" fill="#818cf8" />
    <text x="74" y="28" fill="#818cf8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">2. ML TRAINING</text>
    <text x="74" y="52" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">RF / XGBoost</text>
    <text x="74" y="72" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="10" text-anchor="middle">PR-AUC + MLflow</text>
  </g>

  <g transform="translate(386, 32)">
    <rect x="0" y="0" width="148" height="90" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.8" />
    <circle class="node-pulse" cx="132" cy="16" r="4" fill="#c084fc" />
    <text x="74" y="28" fill="#c084fc" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">3. EXPLAINABILITY</text>
    <text x="74" y="52" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">SHAP Engine</text>
    <text x="74" y="72" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="10" text-anchor="middle">Feature Drivers</text>
  </g>

  <g transform="translate(568, 32)">
    <rect x="0" y="0" width="148" height="90" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.8" />
    <circle class="node-pulse" cx="132" cy="16" r="4" fill="#34d399" />
    <text x="74" y="28" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">4. REST INFERENCE</text>
    <text x="74" y="52" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">FastAPI + Docker</text>
    <text x="74" y="72" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="10" text-anchor="middle">Pydantic Schema</text>
  </g>

  <g transform="translate(750, 32)">
    <rect x="0" y="0" width="148" height="90" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.8" />
    <circle class="node-pulse" cx="132" cy="16" r="4" fill="#fbbf24" />
    <text x="74" y="28" fill="#fbbf24" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">5. DRIFT MONITOR</text>
    <text x="74" y="52" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="bold" text-anchor="middle">KS-Test + UI</text>
    <text x="74" y="72" fill="#94a3b8" font-family="Consolas, Monaco, monospace" font-size="10" text-anchor="middle">Retrain Trigger</text>
  </g>
</svg>